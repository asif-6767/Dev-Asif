:root{
  --bg:#050505; --s1:#101011; --s2:#18181A; --line:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#D0D0D7; --red:#E3202F; --red2:#9E0D1B; --hi:#FF6B75; --glow:rgba(227,32,47,.5);
  --f:&#39;Tatsam&#39;,&#39;Noto Sans Bengali&#39;,&#39;Hind Siliguri&#39;,system-ui,-apple-system,&#39;Segoe UI&#39;,Arial,sans-serif;
  color-scheme:dark;
}
@property --a{syntax:&#39;&lt;angle&gt;&#39;;initial-value:0deg;inherits:false}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-weight:500;font-size:17px;line-height:1.7;overflow-x:hidden}
h1,h2,h3,b,strong{font-family:var(--f);font-weight:700}
h1,h2,h3{line-height:1.35;margin:0;text-wrap:balance}
p{margin:0}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
a{color:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.r{color:var(--hi)}
.muted{color:var(--muted)}
#navbar-iframe,.Navbar{display:none!important}

/* ambient moving light (transform only, smooth) */
.orbs{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg)}
.orbs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.orbs i:nth-child(1){width:520px;height:520px;left:-160px;top:-120px;background:rgba(227,32,47,.55);animation:o1 22s ease-in-out infinite alternate}
.orbs i:nth-child(2){width:460px;height:460px;right:-180px;top:30%;background:rgba(158,13,27,.55);animation:o2 28s ease-in-out infinite alternate}
.orbs i:nth-child(3){width:420px;height:420px;left:10%;bottom:-180px;background:rgba(255,90,60,.32);animation:o3 25s ease-in-out infinite alternate}
@keyframes o1{to{transform:translate3d(180px,160px,0)}}
@keyframes o2{to{transform:translate3d(-200px,-120px,0)}}
@keyframes o3{to{transform:translate3d(240px,-140px,0)}}

/* glass (blur only where it matters, so scrolling stays smooth) */
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 28px rgba(0,0,0,.5)}
.blur{-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%)}
.glow::after{content:&#34;&#34;;position:absolute;top:-1px;right:-1px;bottom:-1px;left:-1px;border-radius:inherit;padding:1.6px;pointer-events:none;
  background:conic-gradient(from var(--a),transparent 0 60%,var(--red) 78%,#fff 90%,var(--hi) 96%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spin 5s linear infinite}
@keyframes spin{to{--a:360deg}}
.spot{position:relative;overflow:hidden}
.spot::before{content:&#34;&#34;;position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.14),transparent 60%)}
.spot:hover::before{opacity:1}

/* reveal on scroll (visible by default if JS is off) */
.js .rv{opacity:0;transform:translate3d(0,16px,0);transition:opacity .6s ease,transform .6s ease}
.js .rv.in{opacity:1;transform:none}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-top:8px}
.hbox{position:relative}
.bar{display:flex;align-items:center;gap:8px;border-radius:999px;padding:6px 8px}
.rb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.07)}
.rb svg{width:23px;height:23px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.logo{display:flex;align-items:center;min-width:0;margin-right:auto;padding:0 4px}
.logo img{height:36px;width:auto;display:block}
.loginbtn{display:flex;align-items:center;gap:8px;border-radius:999px;padding:4px 16px 4px 4px;font-weight:700;background:linear-gradient(180deg,#F0323F,var(--red2));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px var(--glow);flex:none;overflow:hidden}
.loginbtn .c{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}
.loginbtn .c img{width:100%;height:100%;object-fit:cover}
.pop{position:absolute;right:0;top:calc(100% + 10px);width:min(94vw,380px);border-radius:26px;padding:14px;background:linear-gradient(145deg,rgba(40,40,44,.97),rgba(14,14,15,.98))}
.pop[hidden]{display:none}
input,select,textarea{width:100%;font:inherit;font-weight:500;padding:11px 15px;border-radius:16px;border:1px solid var(--line);background:#0A0A0B;color:#fff;min-width:0}
input::placeholder,textarea::placeholder{color:#9A9AA3}
textarea{resize:vertical}
.callnum{font-weight:800;font-size:1.5rem;letter-spacing:.03em;user-select:all;margin:6px 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 10px;border-radius:18px;font-weight:600;text-decoration:none}
.mi:hover,.mi:focus-visible{background:rgba(255,255,255,.08)}
.mi svg.ico{flex:none}

/* drawer */
.dov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:rgba(0,0,0,.68)}
.dov[hidden]{display:none}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(88vw,370px);background:#0B0B0C;border-right:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);box-shadow:0 0 60px rgba(227,32,47,.25);overflow-y:auto;animation:slidein .25s ease}
@keyframes slidein{from{transform:translate3d(-30px,0,0);opacity:0}}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.dhead img{height:38px;width:auto}
.dlist{padding:10px;display:grid;gap:2px}
.dlist .mi{padding:10px 12px;font-size:1.05rem}
.sub{margin:0 0 6px 22px;padding-left:10px;border-left:2px solid rgba(227,32,47,.6)}
.sub .mi{font-weight:500;padding:6px 10px}
.chev{margin-left:auto;opacity:.8;transition:transform .2s}
.mi[aria-expanded=&#34;true&#34;] .chev{transform:rotate(90deg)}
.dfoot{margin-top:auto;padding:16px;border-top:1px solid var(--line);color:var(--muted);display:flex;gap:10px;align-items:center}

/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;padding:11px 22px;font-weight:700;text-decoration:none;text-align:center;font-size:1.02rem}
.btn.red{background:linear-gradient(180deg,#F0323F,var(--red2));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px var(--glow)}
.btn.red::after{content:&#34;&#34;;position:absolute;top:0;bottom:0;left:-60%;width:40%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.btn.ghost{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.55)}
.btn.wa{background:linear-gradient(180deg,#34D673,#0E8A44);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.btn.bk{background:linear-gradient(180deg,#F0307F,#B30E58);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 22px rgba(226,19,110,.4)}
.btn.block{display:flex;width:100%}
.btn.sm{padding:5px 16px;font-size:.95rem}
.btn.dis{opacity:.6;pointer-events:none}
.btn .ar{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:1rem;line-height:1}

main{padding-block:14px 110px}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;padding:7px 16px;border-radius:999px;font-weight:700}
.sec{margin-top:40px}
.sech{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sech h2{font-size:clamp(1.45rem,3.6vw,2.1rem)}
.note{color:var(--muted);font-size:.95rem;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 18px;font-weight:700;font-size:.98rem}

/* hero */
.hero{text-align:center;padding:34px 4px 8px;display:grid;gap:18px;justify-items:center}
.hero h1{font-size:clamp(1.9rem,6.4vw,3.5rem);max-width:15em}
.hero h1 .r{background:linear-gradient(90deg,#FF6B75,#fff,#FF6B75);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sheen 5s linear infinite}
@keyframes sheen{to{background-position:200% center}}
.hero p{color:var(--muted);max-width:34em;font-size:1.08rem}
.hero .row{justify-content:center}

/* strip */
.strip{overflow-x:auto;scrollbar-width:none;margin-top:26px;margin-inline:calc(50% - 50vw);-webkit-mask:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.track{display:flex;width:max-content;padding:8px 0 14px}
.tcard{width:300px;flex:none;margin-right:16px;border-radius:24px;padding:8px;text-align:left}

/* thumbs */
.th{aspect-ratio:16/9;border-radius:18px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:14px;background:radial-gradient(120% 120% at 90% 0%,rgba(227,32,47,.6),transparent 62%),linear-gradient(160deg,#242427,#070707)}
.th.b-ssc{background:radial-gradient(120% 120% at 90% 0%,rgba(255,120,60,.5),transparent 62%),linear-gradient(160deg,#241a1a,#070707)}
.th.b-zero{background:radial-gradient(120% 120% at 90% 0%,rgba(255,60,120,.5),transparent 62%),linear-gradient(160deg,#25181d,#070707)}
.th.b-hsc{background:radial-gradient(120% 120% at 90% 0%,rgba(255,190,60,.45),transparent 62%),linear-gradient(160deg,#241f17,#070707)}
.th img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover}
.joinbox{border-radius:22px;padding:18px;border:1px solid var(--line);border-left:4px solid var(--red);display:grid;gap:10px}
.joinbox p{margin:0}
.joinbox .warn{color:#FFD27A;font-weight:800}
.th.has .offb{top:auto;bottom:10px;left:10px}
.th.has{background:#050505;padding:0}
.th.has img{transition:transform .5s ease}
.tcard:hover .th.has img,.ccard:hover .th.has img{transform:scale(1.04)}
@supports not (aspect-ratio:1/1){.th{min-height:150px}.vid{height:56vw;max-height:440px}}
input,select,textarea{font-size:16px}

.th .t{position:relative;font-weight:800;font-size:1.02rem;line-height:1.4;max-width:68%;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.th .ib{position:absolute;right:10px;top:8px;line-height:0}
.offb{position:absolute;top:10px;left:10px;z-index:2;background:linear-gradient(180deg,#F0323F,var(--red2));color:#fff;font-weight:700;font-size:.9rem;border-radius:999px;padding:1px 12px;box-shadow:0 4px 12px var(--glow)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tile{border-radius:28px;padding:22px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-height:190px;justify-content:center;background:linear-gradient(160deg,#17171A,#09090A)}
.tile b{font-size:1.15rem;line-height:1.35}
.tile span{color:var(--muted);font-size:.92rem}

/* course cards */
.cgrid{display:grid;grid-template-columns:1fr;gap:16px}
.ccard{background:linear-gradient(180deg,#151516,#0A0A0B);border:1px solid var(--line);border-radius:28px;padding:10px;display:flex;flex-direction:column;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .25s,border-color .25s}
.ccard:hover{border-color:rgba(227,32,47,.7);transform:translate3d(0,-3px,0)}
.cbody{padding:14px 10px 10px;display:flex;flex-direction:column;gap:8px;flex:1}
.cprice{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cprice b{font-size:1.75rem;color:var(--hi);line-height:1.1}
.cprice s{color:#B8B8C0}
.clab{color:var(--hi);font-weight:700;font-size:.9rem;letter-spacing:.02em}
.ccard h3{font-size:1.2rem}
.ccard .d{color:var(--muted);font-size:.95rem}
.ccard .mt{color:var(--muted);font-size:.92rem}
.ccard .btn{margin-top:auto}
.empty{color:var(--muted);padding:24px;border-radius:22px;text-align:center}

/* course page */
.cp{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
.cp .aside{display:grid;gap:14px}
.panel{border-radius:26px;padding:18px;min-width:0}
.panel h2,.panel h3{font-size:1.2rem;margin-bottom:10px}
.bigprice{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.bigprice b{font-size:2.3rem;color:var(--hi);line-height:1.1}
.bigprice s{color:#B8B8C0}
.howto{display:flex;align-items:center;gap:10px;color:var(--muted)}
ul.tk{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
ul.tk li{padding-left:28px;position:relative}
ul.tk li::before{content:&#34;✓&#34;;position:absolute;left:0;top:0;color:#5BE39A;font-weight:800}
.rev{border-radius:22px;padding:16px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
form.fm{display:grid;gap:14px}
.msgbox{white-space:pre-wrap;word-break:break-word;background:#0A0A0B;border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.ok{color:#5BE39A;font-weight:700}
.err{color:#FF9CA3;font-weight:700}
.auth{display:grid;justify-items:center;gap:20px;padding:6px 0 34px}
.auth .alogo{height:58px;width:auto;max-width:70%}
.acard{width:min(100%,460px);border-radius:28px;padding:24px 20px;display:grid;gap:14px;background:linear-gradient(160deg,rgba(44,44,48,.94),rgba(14,14,16,.97));border:1px solid var(--line);box-shadow:0 30px 70px -30px #000}
.acard h1{font-size:1.6rem}
.acard .sm2{color:var(--muted);font-size:.92rem;margin-top:-8px}
.acard label.lb{display:grid;gap:7px;font-weight:700;font-size:.95rem}
.ifield{position:relative;display:block}
.ifield .ii{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.75;pointer-events:none}
.ifield input{width:100%;padding-left:44px;padding-right:46px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;opacity:.85}
.eye svg{width:19px;height:19px}
.arow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.92rem}
.chk{display:flex;gap:8px;align-items:center;font-weight:600}
.chk input{width:18px;height:18px;accent-color:#E3202F}
.lnk{color:#FFB3B9;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:2px 0}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.9rem}
.or:before,.or:after{content:&#34;&#34;;flex:1;height:1px;background:var(--line)}
.gbtn{background:rgba(255,255,255,.12);border:1px solid var(--line);color:#fff}
.cpn{display:flex;gap:8px}
.cpn input{flex:1}

/* buy form */
.form{border-radius:30px;padding:22px;display:grid;gap:18px;max-width:820px;margin-inline:auto}
.step{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.step h3{font-size:1.1rem;margin-bottom:4px}
.step ul,.warnbox ul{margin:8px 0 0;padding-left:22px;display:grid;gap:4px}
.num{display:flex;align-items:center;gap:10px;border-radius:16px;padding:8px 12px;background:#0A0A0B;border:1px solid var(--line);margin-top:8px;flex-wrap:wrap}
.num b{font-size:1.2rem;letter-spacing:.03em;user-select:all;flex:1 1 auto}
.num button{border-radius:999px;padding:3px 16px;background:rgba(255,255,255,.12);font-weight:700}
.warnbox{border-radius:22px;padding:16px;background:rgba(227,32,47,.12);border:1px solid rgba(227,32,47,.55)}
.cname{display:inline-block;border-radius:999px;padding:0 14px;background:rgba(255,255,255,.12);font-weight:700}

/* learn */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tab{border-radius:999px;padding:6px 20px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:700}
.tab[aria-pressed=&#34;true&#34;]{background:linear-gradient(180deg,#F0323F,var(--red2));border-color:transparent}
.subj{margin-bottom:16px}
.chap{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;margin-top:10px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:700;transition:background .2s,transform .2s}
.chap:hover{background:rgba(227,32,47,.16)}
.chap .chip{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chap small{font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1);white-space:nowrap}
.chap small.on{background:rgba(227,32,47,.35)}
.vid.pdf{aspect-ratio:3/4;max-height:78vh}
.sub4{font-size:1rem;margin:18px 0 4px;color:#ffb3b9}
.citem{border-top:1px solid var(--line);padding:12px 0}
.crow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.vid{margin-top:12px;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000}
.vid iframe{width:100%;height:100%;border:0}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:20px;padding:14px 16px;margin-bottom:10px;text-decoration:none}
.rimg{display:block;border-radius:18px;overflow:hidden}
.rimg img{display:block;width:100%;height:auto}
.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.8rem;background:linear-gradient(160deg,#FF4755,var(--red2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 18px var(--glow);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.access{border-radius:26px;padding:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}

/* teachers + social */
.tgrid{display:grid;grid-template-columns:1fr;gap:16px}
.teach{border-radius:28px;padding:14px;display:grid;gap:14px;text-align:center;justify-items:center}
.teach .ph{width:min(100%,300px);aspect-ratio:1;border-radius:24px;overflow:hidden;background:#000;display:grid;place-items:center;border:1px solid var(--line)}
.teach .ph img{width:100%;height:100%;object-fit:cover}
.teach .ph .avatar{width:96px;height:96px;font-size:2.4rem}
.teach h3{font-size:1.4rem}
.social{display:grid;grid-template-columns:1fr;gap:12px}
.slink{display:flex;align-items:center;gap:14px;border-radius:24px;padding:12px 16px;text-decoration:none;font-weight:700}
.slink small{display:block;color:var(--muted);font-weight:500}
.notice{border-radius:26px;padding:20px;display:flex;gap:16px;align-items:flex-start;background:linear-gradient(145deg,rgba(227,32,47,.16),rgba(255,255,255,.03));border:1px solid rgba(227,32,47,.5)}
.notice h3{font-size:1.2rem;margin-bottom:6px}

/* modal */
.modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;display:grid;place-items:end center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.74);overflow-y:auto}
.modal[hidden]{display:none}
.sheet{width:min(100%,480px);border-radius:30px;padding:22px;display:grid;gap:14px;background:linear-gradient(145deg,#222226,#0C0C0D);animation:rise .25s ease}
@keyframes rise{from{transform:translate3d(0,24px,0);opacity:0}}
.shares{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#gbtn{display:flex;justify-content:center;min-height:44px}
.shot{max-width:100%;border-radius:16px;margin-top:8px}

/* help + footer */
.help{position:fixed;z-index:15;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;border-radius:999px;padding:6px 7px 6px 20px;font-weight:700;text-decoration:none;background:linear-gradient(180deg,#F0323F,var(--red2));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 28px var(--glow);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 40px rgba(227,32,47,.85)}}
.help .c{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center}
.help svg{width:24px;height:24px;stroke:var(--red);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
footer{border-top:1px solid var(--line);background:#030303;padding-block:34px 28px;margin-top:30px}
.fgrid{display:grid;grid-template-columns:1fr;gap:26px}
footer h3{font-size:1.05rem;margin-bottom:10px}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
footer .lk{color:var(--muted);text-decoration:none;text-align:left}
footer .lk:hover{color:#fff;text-decoration:underline}
footer .flogo{height:46px;width:auto;margin-bottom:10px}
.copy{border-top:1px solid var(--line);margin-top:26px;padding-top:16px;color:var(--muted);font-size:.92rem}

@media (min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}.cgrid{grid-template-columns:repeat(2,1fr)}.tgrid{grid-template-columns:1fr 1fr}.social{grid-template-columns:repeat(2,1fr)}.fgrid{grid-template-columns:1.4fr 1fr 1fr}}
@media (min-width:960px){body{font-size:18px}.cgrid{grid-template-columns:repeat(3,1fr)}.social{grid-template-columns:repeat(3,1fr)}
  .cp{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
  .cp .main1{grid-column:1;grid-row:1}.cp .aside{grid-column:2;grid-row:1/3;position:sticky;top:96px}.cp .rest{grid-column:1;grid-row:2}}
@media (max-width:430px){.loginbtn{padding-right:4px}.loginbtn span.tx{display:none}.logo img{height:32px}.tcard{width:250px}}
/* ===== theme v8: deep crimson glass ===== */
:root{--bg:#060203;--red:#E3202F;--hi:#FF5A66;--line:rgba(255,90,102,.26)}
html,body{background:#060203}
body{background:radial-gradient(130% 55% at 50% -5%,rgba(196,22,38,.38),transparent 62%),#060203}
.orbs{background:transparent}
.orbs i:nth-child(1){background:rgba(227,32,47,.42)}
.orbs i:nth-child(2){background:rgba(150,10,25,.5)}
.orbs i:nth-child(3){background:rgba(227,32,47,.24)}
